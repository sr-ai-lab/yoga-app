name: Video data update

# 毎週月曜 09:00 JST(= 月曜 00:00 UTC)に自動実行。手動実行もできる。
# YouTube API規約: APIで取得して保存したデータは、保存から30日以内に再取得か削除が必要。
# 実行間隔7日なら、1回実行に失敗しても14日以内に次の実行があり、30日に十分な余裕がある。
on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:
    inputs:
      mode:
        description: "incremental=通常の更新 / backfill=過去動画を全件取得し直す(重複しません)"
        type: choice
        options: [incremental, backfill]
        default: incremental
      dry_run:
        description: "true=結果を表示するだけで、ファイルの変更・コミット・公開はしない"
        type: boolean
        default: false

permissions:
  contents: read

# 同時に2つ走って同じファイルを書き換えないようにする
concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # APIを使わない自動テスト。ここで失敗したらデータは更新しない
      - name: Run tests
        run: node --test scripts/test/*.test.mjs

      # APIキーはこのステップの環境変数にだけ渡す(ログには自動でマスクされる。コード・ファイルには置かない)
      - name: Sync videos from YouTube
        id: sync
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          SYNC_MODE: ${{ github.event.inputs.mode || 'incremental' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          set +e
          args="--$SYNC_MODE"
          if [ "$DRY_RUN" = "true" ]; then args="$args --dry-run"; fi
          node scripts/catalog-sync.mjs $args
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          # 0=成功 / 2=一部チャンネルのみ失敗(成功分は保存して最後に失敗扱いにする) / それ以外=データ未変更で即失敗
          if [ "$code" != "0" ] && [ "$code" != "2" ]; then exit "$code"; fi

      - name: Validate data
        run: node scripts/validate.mjs

      - name: Commit changes
        id: commit
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog.json data/videos.json docs/HELD.md
          if git diff --cached --quiet; then
            echo "変更はありません。"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: update video data"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # 保存データの最終更新が古すぎないか(YouTube API規約の30日要件に対する余裕)。14日を超えたら失敗にして知らせる
      - name: Check data freshness
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: node scripts/catalog-sync.mjs --check-freshness --max-days=14

      # 一部のチャンネルだけ失敗した場合: 成功分は保存済み。失敗を見逃さないよう最後に赤にする
      - name: Fail if some channels failed
        if: ${{ !cancelled() && steps.sync.outputs.exit_code == '2' }}
        run: |
          echo "::error::一部のチャンネルの更新に失敗しました。ログの「Sync videos from YouTube」を確認してください(成功したチャンネル分は保存済みです)。"
          exit 1

  # GITHUB_TOKENによるコミットでは、Pagesの自動公開が動かない(GitHub公式の仕様)ため、
  # 更新があったときは同じ実行内でデプロイ用ワークフローを呼び出して公開する(追加のトークンは不要)
  deploy:
    needs: update
    if: ${{ always() && needs.update.outputs.changed == 'true' }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-pages.yml
